version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release, so a compromised version has time to be caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 3.0 moved to the Six Labors Split License; the benchmarks stay on 2.1.x (Apache-2.0). See docs/dependencies.md.
      - dependency-name: SixLabors.ImageSharp
        versions: ['>= 3.0.0']
    groups:
      nuget:
        patterns: ['*']
