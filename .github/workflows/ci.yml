name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Zorg.Imaging.slnx -c Release

      # Oracle-backed tests skip here (no oracle tools on the runners); the oracles job runs them in the gate image.
      - name: Test
        run: dotnet test --project tests/Zorg.Imaging.Tests -c Release --no-build

      - name: Test the system codecs
        run: dotnet test --project tests/Zorg.Imaging.SystemCodecs.Tests -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -p:PackageOutputPath="$RUNNER_TEMP/packages"
          done

      # Design decision D3: the library stays under 3 MB.
      - name: Size limit
        shell: bash
        run: scripts/check-size.sh src/Zorg.Imaging/bin/Release/net10.0/Zorg.Imaging.dll 3072 "Zorg.Imaging.dll"

  # The library targets .NET 10; this runs its tests on the newest runtime, so a change there shows up here first.
  dotnet11:
    name: Tests on .NET 11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build Zorg.Imaging.slnx -c Release

      - name: Test on the .NET 11 runtime
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet test --project tests/Zorg.Imaging.Tests -c Release --no-build
          dotnet test --project tests/Zorg.Imaging.SystemCodecs.Tests -c Release --no-build

  # The system codecs call ImageIO on macOS: real AVIF and HEIC samples (fetched, never committed) decode here. Windows
  # runs the same tests in the build job, where the runner has no HEIF codecs and they report themselves unavailable.
  macos:
    name: System codecs (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Zorg.Imaging.SystemCodecs.Tests -c Release

      - name: Fetch AVIF and HEIC samples
        run: sh scripts/fetch-heif-samples.sh

      - name: Test
        env:
          ZORG_REQUIRE_HEIF_SAMPLES: '1'
        run: dotnet test --project tests/Zorg.Imaging.SystemCodecs.Tests -c Release --no-build

  oracles:
    name: Oracle tests (Alpine gate, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The same container as local runs: every oracle tool is baked into scripts/linux/Dockerfile.alpine,
      # and ZORG_REQUIRE_ORACLES=1 makes a missing tool a failure, not a skip.
      - name: Linux gate
        env:
          ZORG_IMAGING_CONTAINER_CLI: docker
        run: scripts/test-linux.sh --variant alpine

  aot-smoke:
    name: AOT smoke publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # The explicit shell turns on pipefail, so a failed publish isn't hidden by tee.
      # A clean publish proves little on its own, so the sample is also run.
      - name: Publish
        shell: bash
        run: |
          dotnet publish samples/Zorg.Imaging.AotSmoke -r linux-x64 -c Release -o "$RUNNER_TEMP/aot" | tee "$RUNNER_TEMP/publish.log"
          if grep -E '\bIL[23][0-9]{3}\b' "$RUNNER_TEMP/publish.log"; then
            echo "::error::The publish reported trim or AOT warnings."
            exit 1
          fi

      - name: Run
        shell: bash
        run: '"$RUNNER_TEMP/aot/Zorg.Imaging.AotSmoke"'

      # What the library adds to a NativeAOT app, as the smoke sample uses most of it.
      - name: Size limit
        shell: bash
        run: scripts/check-size.sh "$RUNNER_TEMP/aot/Zorg.Imaging.AotSmoke" 6144 "AOT smoke binary (linux-x64)"
