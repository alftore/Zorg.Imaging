name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # A build runs code from NuGet packages, so this job gets no OIDC token and no environment.
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # The tag check below needs the history of main.
          persist-credentials: false

      - name: Check the tag
        id: tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't vMAJOR.MINOR.PATCH with an optional -prerelease."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: dotnet build Zorg.Imaging.slnx -c Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test --solution Zorg.Imaging.slnx -c Release --no-build

      - name: Pack
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -p:Version="$VERSION" -p:PackageOutputPath="$GITHUB_WORKSPACE/artifacts"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  # Only this job can get a NuGet key. It doesn't check out or run repository code, and it waits
  # for the reviewers of the nuget environment.
  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Last, because the key it returns is valid for one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Symbols are pushed with the package: the .snupkg sits next to the .nupkg.
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # One package at a time, skipping a version that's already there: a new package ID is uploaded by hand once
        # (trusted publishing can't create one), and this run then pushes the rest.
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
